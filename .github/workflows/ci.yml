name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    name: Validate and test
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and marketplace
        run: claude plugin validate .
      - name: Run the hook tests
        run: claude plugin test .
      - name: Type check
        run: |
          # Claude Code writes this build's types in .claude-plugin/types/
          # (gitignored) only when an interactive session loads the plugin
          # (since 2.1.295), so one starts in a pseudo-terminal with the
          # first-run screens answered. It sends no prompt, its key is a
          # placeholder and its API address a closed port, so nothing leaves
          # the runner; it is stopped once the types are in.
          key=sk-ant-ci-placeholder-0000000000000000
          printf '{"hasCompletedOnboarding":true,"theme":"dark","customApiKeyResponses":{"approved":["%s"],"rejected":[]},"projects":{"%s":{"hasTrustDialogAccepted":true}}}\n' "${key: -20}" "$PWD" > ~/.claude.json
          sleep 60 | ANTHROPIC_API_KEY=$key ANTHROPIC_BASE_URL=http://127.0.0.1:9 timeout 60 script -qfec "claude --plugin-dir ." /dev/null > /dev/null &
          for _ in $(seq 60); do
            test -f .claude-plugin/types/tsconfig.json && test -f .claude-plugin/types/claude-code/index.d.ts && break
            sleep 1
          done
          sleep 1
          kill %1 2>/dev/null || true
          head -1 .claude-plugin/types/claude-code/index.d.ts
          npx -y -p typescript@5.6 tsc -p . --noEmit
